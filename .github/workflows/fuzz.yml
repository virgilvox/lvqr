name: Fuzz

# cargo-fuzz targets for the LVQR parser crates:
#
#   - crates/lvqr-ingest/fuzz: RTMP/FLV parsers.
#   - crates/lvqr-codec/fuzz: HEVC SPS + AAC AudioSpecificConfig
#     parsers plus the shared BitReader exp-Golomb decoder.
#   - crates/lvqr-whep/fuzz: str0m SdpOffer parser (the first byte
#     a WHEP server runs over an attacker-controlled body).
#   - crates/lvqr-whip/fuzz: Annex B -> AVCC depack (the first
#     byte a WHIP bridge runs over str0m `Event::MediaData`
#     payloads). Added in session 31.
#   - crates/lvqr-cmaf/fuzz: init-segment codec-string detectors
#     (publisher-reachable input side of `detect_video_codec_string`
#     and `detect_audio_codec_string`). Wired in session 172 to
#     close the CI gap surfaced by the post-B-5 audit.
#   - crates/lvqr-hls/fuzz: `PlaylistBuilder` state machine,
#     including the session-33 closed-segment coalesce path and the
#     session-34 sliding-window eviction path. Wired in session 172
#     because the B-5 styp prepend at `HlsServer::push_chunk_bytes`
#     widens the byte-shape surface this target already exercises.
#
# Two cadences:
#
#   - Every PR runs each target for 60 seconds. This is educational
#     during Tier 1 per tests/CONTRACT.md: the job is set to
#     continue-on-error so a crash does not block the PR, but the
#     run is surfaced in the Checks tab and any crash corpus is
#     uploaded as an artifact for investigation.
#
#   - Nightly cron runs each target for 15 minutes. Same soft-fail
#     rule; findings get triaged out of band and land in
#     crates/lvqr-conformance/fixtures/edge-cases/<target>/.
#
# Both cadences run on nightly rustc because libfuzzer-sys requires
# sanitizer instrumentation that stable does not ship.

on:
  pull_request:
    branches: [main]
    paths:
      - "crates/lvqr-ingest/src/**"
      - "crates/lvqr-ingest/fuzz/**"
      - "crates/lvqr-codec/src/**"
      - "crates/lvqr-codec/fuzz/**"
      - "crates/lvqr-whep/src/**"
      - "crates/lvqr-whep/fuzz/**"
      - "crates/lvqr-whip/src/**"
      - "crates/lvqr-whip/fuzz/**"
      - "crates/lvqr-cmaf/src/**"
      - "crates/lvqr-cmaf/fuzz/**"
      - "crates/lvqr-hls/src/**"
      - "crates/lvqr-hls/fuzz/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    # 07:00 UTC daily. Low-contention window for Linux runners.
    - cron: "0 7 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    # Soft-fail throughout Tier 1 per tests/CONTRACT.md. Promote to a
    # hard-fail once Tier 2 lands and the fuzz corpora are stable.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: parse_video_tag
            fuzz_dir: crates/lvqr-ingest/fuzz
          - target: parse_audio_tag
            fuzz_dir: crates/lvqr-ingest/fuzz
          - target: parse_hevc_sps
            fuzz_dir: crates/lvqr-codec/fuzz
          - target: parse_aac_asc
            fuzz_dir: crates/lvqr-codec/fuzz
          - target: read_ue_v
            fuzz_dir: crates/lvqr-codec/fuzz
          - target: parse_offer_sdp
            fuzz_dir: crates/lvqr-whep/fuzz
          - target: parse_annex_b
            fuzz_dir: crates/lvqr-whip/fuzz
          - target: detect_codec_strings
            fuzz_dir: crates/lvqr-cmaf/fuzz
          - target: playlist_builder
            fuzz_dir: crates/lvqr-hls/fuzz
          # Adversarial network/publisher parsers wired in from the
          # session-172 backlog: SCTE-35 (RTMP onCuePoint), MPEG-TS
          # demux, and the RTSP RTP request/header/depacketizer paths.
          # All consume untrusted wire bytes and must never panic.
          - target: parse_scte35
            fuzz_dir: crates/lvqr-codec/fuzz
          - target: ts_demux
            fuzz_dir: crates/lvqr-codec/fuzz
          - target: parse_rtsp_request
            fuzz_dir: crates/lvqr-rtsp/fuzz
          - target: parse_rtp_header
            fuzz_dir: crates/lvqr-rtsp/fuzz
          - target: depack_h264
            fuzz_dir: crates/lvqr-rtsp/fuzz
          - target: depack_hevc
            fuzz_dir: crates/lvqr-rtsp/fuzz
          - target: depack_aac
            fuzz_dir: crates/lvqr-rtsp/fuzz
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry and fuzz build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.fuzz_dir }} -> target
          # Separate key namespace so the nightly fuzz cache does not
          # collide with the stable workspace cache from ci.yml.
          prefix-key: fuzz-v1

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Determine run duration
        id: duration
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "seconds=900" >> "$GITHUB_OUTPUT"
          else
            echo "seconds=60" >> "$GITHUB_OUTPUT"
          fi

      - name: Run ${{ matrix.target }} for ${{ steps.duration.outputs.seconds }}s
        working-directory: ${{ matrix.fuzz_dir }}
        run: |
          cargo +nightly fuzz run ${{ matrix.target }} -- \
            -max_total_time=${{ steps.duration.outputs.seconds }} \
            -print_final_stats=1

      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}-${{ github.run_id }}
          path: |
            ${{ matrix.fuzz_dir }}/artifacts/${{ matrix.target }}/**
            ${{ matrix.fuzz_dir }}/corpus/${{ matrix.target }}/**
          if-no-files-found: ignore
          retention-days: 30

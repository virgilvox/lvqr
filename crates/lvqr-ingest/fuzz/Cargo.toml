[package]
name = "lvqr-ingest-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.85"

# Excluded from the main workspace because libfuzzer-sys requires nightly
# rustc and sanitizer instrumentation that the stable workspace builds
# cannot produce. Run with:
#
#   cargo +nightly fuzz run parse_video_tag
#   cargo +nightly fuzz run parse_audio_tag
#
# Seeds for each target live under fuzz/corpus/<target>/ and are populated
# progressively from the lvqr-conformance fixture corpus plus regression
# samples from past crashes.

# Standalone workspace root. This crate is in the parent workspace's
# `exclude` list, so it must declare its own (empty) workspace table or
# `cargo +nightly fuzz` errors "current package believes it's in a
# workspace when it's not" when it resolves this manifest on its own.
[workspace]

# rml_rtmp is vendored at the repo root via [patch.crates-io] (the
# session-152 SCTE-35 fork that adds the `Amf0DataReceived` event +
# `finish_publishing_with_error`). A standalone workspace does not
# inherit the parent's patch, so re-declare it here or the
# rml_rtmp-dependent lvqr crates fail to compile against the unpatched
# crates.io rml_rtmp 0.8.0.
[patch.crates-io]
rml_rtmp = { path = "../../../vendor/rml_rtmp" }

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1"
lvqr-ingest = { path = ".." }

[[bin]]
name = "parse_video_tag"
path = "fuzz_targets/parse_video_tag.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_audio_tag"
path = "fuzz_targets/parse_audio_tag.rs"
test = false
doc = false
bench = false

[profile.release]
debug = true

[package]
name = "lvqr-rtsp-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.85"

# Excluded from the main workspace because libfuzzer-sys requires nightly
# rustc and sanitizer instrumentation that the stable workspace builds
# cannot produce. Run with:
#
#   cargo +nightly fuzz run parse_rtsp_request
#   cargo +nightly fuzz run parse_rtp_header
#   cargo +nightly fuzz run depack_h264
#   cargo +nightly fuzz run depack_hevc
#   cargo +nightly fuzz run depack_aac
#
# The proptest harness at `tests/proptest_parsers.rs` covers the same
# never-panic invariants on a ~200-case budget; these fuzz targets run
# much longer and cover inputs proptest's strategy cannot reach.

# Standalone workspace root. This crate is in the parent workspace's
# `exclude` list, so it must declare its own (empty) workspace table or
# `cargo +nightly fuzz` errors "current package believes it's in a
# workspace when it's not" when it resolves this manifest on its own.
[workspace]

# rml_rtmp is vendored at the repo root via [patch.crates-io] (the
# session-152 SCTE-35 fork that adds the `Amf0DataReceived` event +
# `finish_publishing_with_error`). A standalone workspace does not
# inherit the parent's patch, so re-declare it here or the
# rml_rtmp-dependent lvqr crates fail to compile against the unpatched
# crates.io rml_rtmp 0.8.0.
[patch.crates-io]
rml_rtmp = { path = "../../../vendor/rml_rtmp" }

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lvqr-rtsp = { path = ".." }

[[bin]]
name = "parse_rtsp_request"
path = "fuzz_targets/parse_rtsp_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_rtp_header"
path = "fuzz_targets/parse_rtp_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "depack_h264"
path = "fuzz_targets/depack_h264.rs"
test = false
doc = false
bench = false

[[bin]]
name = "depack_hevc"
path = "fuzz_targets/depack_hevc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "depack_aac"
path = "fuzz_targets/depack_aac.rs"
test = false
doc = false
bench = false

[profile.release]
debug = true
